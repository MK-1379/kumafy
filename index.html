<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kumafy</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div class="titlebar">
		<div class="drag-area"></div>
		<div class="window-controls">
			<input type="image" src="img/MinAN.png" id="minBtn" alt="Minimize">
			<input type="image" src="img/CrossAN.png" id="closeBtn" alt="Close">
		</div>
	</div>
	<br><br>

	<div class="centro">
		<div class="imgcont">
			<img id="cover" alt="Genre cover">
		</div>
	</div>

	<h4>Genre</h4>
	<select id="genreSelect" aria-label="Genre"></select>

	<h2 id="title">Title</h2>
	<h3 id="artist">Artist</h3>

	<audio id="audio"></audio>

	<div id="tiempo">
		<span id="current">0:00</span> / <span id="duration">0:00</span>
	</div>

	<input type="range" id="progress" min="0" value="0" step="0.1" aria-label="Seek">

	<br><br><br>

	<div class="botones">
		<input type="image" src="img/PrevAN.png" id="prevBtn" alt="Previous">
		<input type="image" src="img/PlayAN.png" id="playBtn" alt="Play">
		<input type="image" src="img/PauseAN.png" id="pauseBtn" alt="Pause">
		<input type="image" src="img/StopAN.png" id="stopBtn" alt="Stop">
		<input type="image" src="img/MuteAN.png" id="muteBtn" alt="Mute">
		<input type="image" src="img/NextAN.png" id="nextBtn" alt="Next">
	</div>

	<script src="tracks.js"></script>
	<script src="player.js"></script>
</body>

</html>
