<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob: kumafy-media:; object-src 'none'; base-uri 'none'; form-action 'none'">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kumafy</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div class="titlebar">
		<div class="drag-area"></div>
		<div class="window-controls">
			<button type="button" id="minBtn" aria-label="Minimize"><img src="img/MinAN.png" alt=""></button>
			<button type="button" id="closeBtn" aria-label="Close"><img src="img/CrossAN.png" alt=""></button>
		</div>
	</div>

	<div class="centro">
		<div class="imgcont">
			<img id="cover" alt="Genre cover">
			<canvas id="visualizer" class="visualizer" aria-hidden="true"></canvas>
			<div id="trackPanel" class="track-panel" hidden>
				<ol id="trackList" aria-label="Tracks"></ol>
			</div>
		</div>
	</div>

	<label for="genreSelect" class="genre-label">Genre</label>
	<select id="genreSelect"></select>

	<div aria-live="polite">
		<h2 id="title">Title</h2>
		<h3 id="artist">Artist</h3>
	</div>

	<div id="tiempo">
		<span id="current">0:00</span> / <span id="duration">0:00</span>
	</div>

	<input type="range" id="progress" min="0" value="0" step="0.1" aria-label="Seek">

	<div class="botones">
		<button type="button" id="prevBtn" title="Previous (P)" aria-keyshortcuts="P" aria-label="Previous"><img src="img/PrevAN.png" alt=""></button>
		<button type="button" id="playBtn" title="Play/Pause (Space)" aria-keyshortcuts="Space" aria-label="Play"><img src="img/PlayAN.png" alt=""></button>
		<button type="button" id="stopBtn" aria-label="Stop"><img src="img/StopAN.png" alt=""></button>
		<button type="button" id="nextBtn" title="Next (N)" aria-keyshortcuts="N" aria-label="Next"><img src="img/NextAN.png" alt=""></button>
	</div>

	<div class="botones secundarios">
		<button type="button" id="shuffleBtn" title="Shuffle (S)" aria-keyshortcuts="S" class="toggle" aria-label="Shuffle" aria-pressed="false"><img src="img/ShuffleAN.svg" alt=""></button>
		<button type="button" id="repeatBtn" title="Repeat (R)" aria-keyshortcuts="R" class="toggle" aria-label="Repeat: off" aria-pressed="false"><img src="img/RepeatAN.svg" alt=""></button>
		<button type="button" id="listBtn" title="Track list (L)" aria-keyshortcuts="L" aria-label="Track list" aria-expanded="false" aria-controls="trackPanel"><img src="img/ListAN.svg" alt=""></button>
		<button type="button" id="openBtn" title="Open files (O)" aria-keyshortcuts="O" aria-label="Open audio files"><img src="img/OpenAN.svg" alt=""></button>
		<button type="button" id="muteBtn" title="Mute (M)" aria-keyshortcuts="M" aria-label="Mute" aria-pressed="false"><img src="img/VolumeAN.svg" alt=""></button>
		<input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
	</div>

	<script type="module" src="js/player.js"></script>
</body>

</html>
