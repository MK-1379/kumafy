<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kumafy</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div class="titlebar">
		<div class="drag-area"></div>
		<div class="window-controls">
			<button type="button" id="minBtn" aria-label="Minimize"><img src="img/MinAN.png" alt=""></button>
			<button type="button" id="closeBtn" aria-label="Close"><img src="img/CrossAN.png" alt=""></button>
		</div>
	</div>
	<br><br>

	<div class="centro">
		<div class="imgcont">
			<img id="cover" alt="Genre cover">
		</div>
	</div>

	<label for="genreSelect" class="genre-label">Genre</label>
	<select id="genreSelect"></select>

	<div aria-live="polite">
		<h2 id="title">Title</h2>
		<h3 id="artist">Artist</h3>
	</div>

	<div id="tiempo">
		<span id="current">0:00</span> / <span id="duration">0:00</span>
	</div>

	<input type="range" id="progress" min="0" value="0" step="0.1" aria-label="Seek">

	<br><br><br>

	<div class="botones">
		<button type="button" id="prevBtn" aria-label="Previous"><img src="img/PrevAN.png" alt=""></button>
		<button type="button" id="playBtn" aria-label="Play"><img src="img/PlayAN.png" alt=""></button>
		<button type="button" id="pauseBtn" aria-label="Pause"><img src="img/PauseAN.png" alt=""></button>
		<button type="button" id="stopBtn" aria-label="Stop"><img src="img/StopAN.png" alt=""></button>
		<button type="button" id="muteBtn" aria-label="Mute" aria-pressed="false"><img src="img/MuteAN.png" alt=""></button>
		<button type="button" id="nextBtn" aria-label="Next"><img src="img/NextAN.png" alt=""></button>
	</div>

	<script type="module" src="js/player.js"></script>
</body>

</html>
